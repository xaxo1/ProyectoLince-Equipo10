spring.application.name=lince-backend
server.port=8080
# Escucha en todas las interfaces: el teléfono se conecta por la IP del PC en la misma red WiFi
server.address=0.0.0.0

# ---------- Base de datos (H2 en archivo: se conserva al reiniciar) ----------
spring.datasource.url=jdbc:h2:file:./data/lince;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------- Reglas del negocio (parametrizables) ----------
# Radio inicial de las geocercas, en metros
lince.geocerca.radio-defecto=150
# Precisión GPS máxima aceptada para verificar la llegada, en metros
lince.geocerca.precision-maxima=50
# Minutos de anticipación mínimos al pickup para que el check-in sea puntual
lince.puntualidad.minutos-antes=15
# Días de anticipación mínimos para bloquear un día
lince.disponibilidad.dias-anticipacion=7
lince.zona-horaria=America/Santiago

# ---------- Seguridad ----------
lince.jwt.horas-validez=12

# ---------- Lince API del cliente (solo lectura) ----------
lince.api.url=https://ws.southbound.travel/lince-api
# La X-API-Key y el secreto JWT NO van en el repositorio:
# se leen de config/secretos.properties (excluido de Git) o de variables de entorno.
spring.config.import=optional:file:./config/secretos.properties
